name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# CI's only artifact target is the Raspberry Pi. The macOS binary is built
# locally on the developer's MacBook with the existing cmake/ninja setup, so
# there is deliberately no macOS job here.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test ./...

      - name: shellcheck
        run: shellcheck -S warning deploy/*.sh

      # Compiling the frontend against SDL on Linux catches breakage in the
      # shared C++ before it reaches the Mac, where it is built by hand.
      - name: frontend compile check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libsdl2-dev
          cmake -B build -G Ninja -DFRAME_DISPLAY=sdl
          cmake --build build

  pi:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build aarch64 binaries
        run: |
          nix build .#frontend-aarch64 --print-build-logs -o result-frontend
          nix build .#backend-aarch64 --print-build-logs -o result-backend

      - name: Assemble release tarball
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) VERSION="0.0.0-${GITHUB_SHA::7}" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          STAGE=picture-frame
          mkdir -p "$STAGE/bin"
          install -m 0755 result-frontend/bin/picture-frontend "$STAGE/bin/"
          install -m 0755 result-backend/bin/picture-backend "$STAGE/bin/"
          install -m 0644 deploy/picture-backend.service \
                          deploy/picture-frontend.service \
                          deploy/config.example.toml \
                          deploy/tailnet-policy.hujson "$STAGE/"
          install -m 0755 deploy/install.sh deploy/update.sh "$STAGE/"
          echo "$VERSION" > "$STAGE/VERSION"

          # update.sh looks these names up verbatim; changing either breaks
          # every deployed frame's ability to update itself.
          TARBALL="picture-frame-$VERSION-aarch64.tar.gz"
          tar -czf "$TARBALL" "$STAGE"
          sha256sum "$TARBALL" > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: picture-frame-${{ steps.package.outputs.version }}-aarch64
          path: |
            picture-frame-*.tar.gz
            SHA256SUMS

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            picture-frame-*.tar.gz
            SHA256SUMS
